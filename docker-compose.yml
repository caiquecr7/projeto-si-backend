services:
  postgres:
    image: postgres:17-alpine
    container_name: projeto-si-postgres
    environment:
      POSTGRES_DB: projeto_si
      POSTGRES_USER: projeto_si
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projeto_si_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projeto_si -d projeto_si"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml-api:
    build: ../projeto_si_ml_api
    container_name: projeto-si-ml-api
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-docker-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,ml-api,api}
      DATABASE_URL: postgres://projeto_si:${POSTGRES_PASSWORD:-projeto_si_dev}@postgres:5432/projeto_si
      BIOMETRICS_MODELS_DIR: /app/models_data
    ports:
      - "${ML_API_PORT:-8000}:8000"
    volumes:
      - models-data:/app/models_data
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    container_name: projeto-si-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "5000"
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=projeto_si;Username=projeto_si;Password=${POSTGRES_PASSWORD:-projeto_si_dev}
      Biometria__MlApiUrl: ${ML_API_URL:-http://ml-api:8000}
    ports:
      - "${API_PORT:-5000}:5000"
    networks:
      default:
        aliases:
          - mock-api
    depends_on:
      postgres:
        condition: service_healthy
      ml-api:
        condition: service_started

  frontend:
    profiles: ["frontend"]
    build: ../projeto_si_frontend
    container_name: projeto-si-frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - api

volumes:
  postgres-data:
  models-data:
